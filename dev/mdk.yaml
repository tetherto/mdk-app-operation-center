# Local dev stack for Operation Center Lite. `mdk run --dir dev` boots the
# Kernel, the vendor miner workers and a simulated power meter on mock devices,
# this app (from the repo root, `..`) and the Gateway; `mdk run dashboard`
# loads the app UI into a local dashboard. For UI work without the workers,
# `npm run dev:stack:mock` runs dev/mock-site/mdk.yaml instead.
#
# The site: four containers, two racks of ten sockets each, the last two
# sockets of rack 2 empty, one power meter per container. Containers 1 to 3
# are Whatsminers (API v3 mock), container 4 is Antminers (CGI mock). Every
# device id below appears once in the app's `layout`, which is what gives it
# a container, rack and socket: MDK devices carry no position of their own.
apiVersion: mdk/v1
kind: Stack
metadata:
  name: op-centre-lite-dev
spec:
